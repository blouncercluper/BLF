<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111c2e"><title>Santri Scope — Teacher Workspace</title>
<style>
:root{--bg:#101827;--panel:#182337;--panel2:#202e45;--line:#2c3b54;--ink:#eef3fb;--muted:#9aa9bf;--gold:#e3bf69;--blue:#7fa8ff;--danger:#ff7b85;--radius:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0,#20314b 0,transparent 36%),var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.wrap{min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:#0d1522cc;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f0d487,#a77c2c);color:#142034;font-weight:900;font-size:20px}.brand strong{font-size:15px;letter-spacing:1.4px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.7px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted)}.container{max-width:1220px;margin:auto;padding:32px clamp(16px,4vw,48px)}.eyebrow{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:11px}.title{font-size:clamp(27px,4vw,40px);line-height:1.1;margin:8px 0}.subtitle{color:var(--muted);margin:0 0 28px}.btn{background:var(--gold);color:#162237;font-weight:800;border-radius:12px;padding:11px 15px}.btn.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn.small{padding:8px 11px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:linear-gradient(150deg,#1b2940,#151f31);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 15px 35px #0001}.institution{position:relative;overflow:hidden;transition:.18s transform,.18s border-color;cursor:pointer}.institution:hover{transform:translateY(-3px);border-color:#d8b45c}.institution:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#dfba6220;right:-55px;top:-55px}.inst-icon{width:52px;height:52px;border-radius:16px;background:#d9b76020;border:1px solid #d9b76055;display:grid;place-items:center;font-size:25px;margin-bottom:15px}.card h3{margin:0 0 5px;font-size:19px}.card p{margin:0;color:var(--muted)}.stats{display:flex;gap:16px;margin:18px 0 0;color:#b4c2d7;font-size:13px}.stats b{color:var(--ink)}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:var(--gold);font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);margin-bottom:20px;font-size:13px}.crumb button{background:none;color:var(--gold);padding:0}.class-card{cursor:pointer;transition:.18s}.class-card:hover{transform:translateY(-2px);border-color:var(--blue)}.classicon{font-size:28px;margin-bottom:12px}.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}.student{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px 10px;text-align:center;cursor:pointer;transition:.18s}.student:hover{border-color:var(--gold);transform:translateY(-2px)}.avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:45px;background:linear-gradient(145deg,#2b405e,#1b2b43);border:2px solid #354966}.avatar.girl{background:linear-gradient(145deg,#624b69,#44334d);border-color:#8b7193}.student-name{font-weight:700;font-size:14px;word-break:break-word}.student-meta{color:var(--muted);font-size:11px;margin-top:3px}.empty{border:1px dashed #40516a;border-radius:16px;padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}.empty .emoji{font-size:38px;margin-bottom:8px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.statbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.statbox span{color:var(--muted);font-size:12px}.statbox strong{display:block;font-size:24px;margin-top:5px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:20px}.search{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink);min-width:220px}.modal-back{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:10}.modal-back.show{display:grid}.modal{background:#182438;border:1px solid #34445f;border-radius:20px;width:min(460px,100%);padding:22px;box-shadow:0 25px 80px #0007}.modal h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#b7c5d9;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#111b2a;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.profile-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.profile-head .avatar{margin:0;width:110px;height:110px;font-size:60px}.profile-notes{width:100%;max-width:600px}.notearea{width:100%;min-height:110px;background:#111b2a;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px}.hide{display:none!important}.backbtn{margin-right:8px}.footer-note{color:#6f819c;font-size:12px;text-align:center;margin:36px 0 12px}.danger{color:var(--danger)}@media(max-width:700px){.top{padding:14px}.topright .label{display:none}.container{padding-top:23px}.statgrid{grid-template-columns:repeat(2,1fr)}.student-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}.card{padding:16px}}
</style></head><body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">S</div><div><strong>SANTRI SCOPE</strong><small>TEACHER WORKSPACE</small></div></div><div class="topright"><span class="label">Ruang kerja pengajar</span><span>◈</span></div></header>
<main class="container" id="app"></main>
<div class="modal-back" id="modal"><div class="modal"><h2 id="modalTitle">Tambah</h2><form id="form"></form></div></div>
</div>
<script>
const KEY='santriscope_v1';
let db=loadDB(),view='institutions',activeInst=null,activeClass=null,activeStudent=null,searchTerm='';
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{institutions:[]}}catch{return{institutions:[]}}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function institution(){return db.institutions.find(x=>x.id===activeInst)}
function klass(){return institution()?.classes.find(x=>x.id===activeClass)}
function students(){return institution()?.classes.flatMap(c=>c.students)||[]}
function showModal(title,fields,onSave){document.getElementById('modalTitle').textContent=title;let f=document.getElementById('form');f.innerHTML=fields.map(x=>'<div class="field"><label>'+x.label+'</label>'+x.html+'</div>').join('')+'<div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" type="submit">Simpan</button></div>';document.getElementById('modal').classList.add('show');f.onsubmit=e=>{e.preventDefault();const d={};fields.forEach(x=>d[x.key]=f.elements[x.key]?.value||'');onSave(d);closeModal()}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addInstitution(){showModal('Tambah Lembaga',[{key:'name',label:'Nama lembaga',html:'<input name="name" placeholder="Contoh: Madin Al-Hikmah" required>'},{key:'description',label:'Keterangan (opsional)',html:'<input name="description" placeholder="Alamat / keterangan singkat">'}],d=>{db.institutions.push({id:crypto.randomUUID(),name:d.name.trim(),description:d.description,classes:[]});saveDB();render()})}
function addClass(){showModal('Tambah Kelas',[{key:'name',label:'Nama kelas',html:'<input name="name" placeholder="Contoh: Kelas 1 / Ula A" required>'}],d=>{institution().classes.push({id:crypto.randomUUID(),name:d.name.trim(),students:[]});saveDB();render()})}
function addStudent(){showModal('Tambah Santri',[{key:'name',label:'Nama lengkap santri',html:'<input name="name" placeholder="Masukkan nama santri" required>'},{key:'gender',label:'Jenis kelamin',html:'<select name="gender" required><option value="">Pilih jenis kelamin</option><option value="male">Laki-laki</option><option value="female">Perempuan</option></select>'},{key:'birth',label:'Tanggal lahir (opsional)',html:'<input name="birth" type="date">'}],d=>{klass().students.push({id:crypto.randomUUID(),name:d.name.trim(),gender:d.gender,birth:d.birth,notes:'',observations:[]});saveDB();render()})}
function editNotes(){let s=activeStudent;showModal('Catatan perkembangan',[{key:'notes',label:'Catatan guru (privat)',html:'<textarea name="notes" rows="7" placeholder="Catat pengamatan, perkembangan, kekuatan, atau hal yang perlu didampingi..." style="width:100%;background:#111b2a;color:#eef3fb;border:1px solid #2c3b54;border-radius:11px;padding:11px">'+esc(s.notes)+'</textarea>'}],d=>{s.notes=d.notes;saveDB();render()})}
function deleteStudent(){if(!confirm('Hapus data santri '+activeStudent.name+'?'))return;klass().students=klass().students.filter(s=>s.id!==activeStudent.id);activeStudent=null;view='students';saveDB();render()}
function deleteClass(){if(!confirm('Hapus kelas beserta seluruh data santri di kelas ini?'))return;institution().classes=institution().classes.filter(c=>c.id!==activeClass);activeClass=null;view='classes';saveDB();render()}
function deleteInstitution(){if(!confirm('Hapus lembaga beserta kelas dan data santrinya?'))return;db.institutions=db.institutions.filter(i=>i.id!==activeInst);activeInst=null;view='institutions';saveDB();render()}
function go(v){view=v;searchTerm='';render()}
function openInstitution(id){activeInst=id;view='institution';render()}
function openClass(id){activeClass=id;view='students';render()}
function openStudent(id){activeStudent=klass().students.find(s=>s.id===id);view='student';render()}
function back(){if(view==='institution')view='institutions';else if(view==='classes')view='institution';else if(view==='students')view='classes';else if(view==='student')view='students';render()}
function render(){
 const app=document.getElementById('app');
 if(view==='institutions'){app.innerHTML='<div class="eyebrow">Pusat Pendidikan</div><h1 class="title">Pilih Lembaga</h1><p class="subtitle">Pilih tempat mengajar untuk mengelola kelas dan memantau santri.</p><div class="toolbar"><div></div><button class="btn" onclick="addInstitution()">＋ Tambah Lembaga</button></div><div class="cards">'+(db.institutions.length?db.institutions.map(i=>'<div class="card institution" onclick="openInstitution(\''+i.id+'\')"><div class="inst-icon">🏫</div><h3>'+esc(i.name)+'</h3><p>'+esc(i.description||'Ruang pengelolaan lembaga')+'</p><div class="stats"><span><b>'+i.classes.length+'</b> kelas</span><span><b>'+i.classes.reduce((a,c)=>a+c.students.length,0)+'</b> santri</span></div><div class="card-foot"><span>Buka dashboard</span><span>↗</span></div></div>').join(''):'<div class="empty"><div class="emoji">🏛️</div><b>Belum ada lembaga</b><p>Tambahkan lembaga pertama untuk mulai mengatur kelas.</p></div>'+'</div>';return}
 if(view==='institution'){let i=institution();app.innerHTML='<div class="crumb"><button onclick="go(\'institutions\')">← Semua lembaga</button><span>/</span><span>'+esc(i.name)+'</span></div><div class="eyebrow">Dashboard Lembaga</div><h1 class="title">'+esc(i.name)+'</h1><p class="subtitle">'+esc(i.description||'Kelola kelas dan data santri pada lembaga ini.')+'</p><div class="statgrid"><div class="statbox"><span>Total Santri</span><strong>'+i.classes.reduce((a,c)=>a+c.students.length,0)+'</strong></div><div class="statbox"><span>Total Kelas</span><strong>'+i.classes.length+'</strong></div><div class="statbox"><span>Laki-laki</span><strong>'+i.classes.reduce((a,c)=>a+c.students.filter(s=>s.gender==='male').length,0)+'</strong></div><div class="statbox"><span>Perempuan</span><strong>'+i.classes.reduce((a,c)=>a+c.students.filter(s=>s.gender==='female').length,0)+'</strong></div></div><div class="toolbar"><h2>Daftar Kelas</h2><button class="btn" onclick="addClass()">＋ Tambah Kelas</button></div><div class="cards">'+(i.classes.length?i.classes.map(c=>'<div class="card class-card" onclick="openClass(\''+c.id+'\')"><div class="classicon">📚</div><h3>'+esc(c.name)+'</h3><p>'+c.students.length+' santri terdaftar</p><div class="card-foot"><span>Lihat santri</span><span>↗</span></div></div>').join(''):'<div class="empty"><div class="emoji">📚</div><b>Belum ada kelas</b><p>Buat kelas untuk mulai memasukkan santri.</p></div>')+'</div><div class="toolbar" style="margin-top:25px"><button class="btn ghost danger" onclick="deleteInstitution()">Hapus lembaga</button></div>';return}
 if(view==='classes'){view='institution';render();return}
 if(view==='students'){let c=klass();let list=c.students.filter(s=>s.name.toLowerCase().includes(searchTerm.toLowerCase()));app.innerHTML='<div class="crumb"><button onclick="go(\'institution\')">← Dashboard lembaga</button><span>/</span><span>'+esc(institution().name)+'</span><span>/</span><span>'+esc(c.name)+'</span></div><div class="eyebrow">Ruang Kelas</div><h1 class="title">'+esc(c.name)+'</h1><p class="subtitle">Daftar santri kelas ini. Klik avatar untuk membuka profil dan catatan penelitian.</p><div class="toolbar"><input class="search" placeholder="Cari nama santri..." value="'+esc(searchTerm)+'" oninput="searchTerm=this.value;render()"><button class="btn" onclick="addStudent()">＋ Tambah Santri</button></div><div class="student-grid">'+(list.length?list.map(s=>'<div class="student" onclick="openStudent(\''+s.id+'\')"><div class="avatar '+(s.gender==='female'?'girl':'')+'">'+(s.gender==='female'?'👧':'👦')+'</div><div class="student-name">'+esc(s.name)+'</div><div class="student-meta">'+(s.gender==='female'?'Santri perempuan':'Santri laki-laki')+'</div></div>').join(''):'<div class="empty"><div class="emoji">👥</div><b>Santri belum ada</b><p>Tambahkan santri, avatar akan dipilih otomatis berdasarkan jenis kelamin.</p></div>')+'</div><div class="toolbar" style="margin-top:24px"><button class="btn ghost danger" onclick="deleteClass()">Hapus kelas</button></div>';return}
 if(view==='student'){let s=activeStudent;app.innerHTML='<div class="crumb"><button onclick="go(\'students\')">← Kembali ke daftar santri</button><span>/</span><span>'+esc(s.name)+'</span></div><div class="card"><div class="profile-head"><div class="avatar '+(s.gender==='female'?'girl':'')+'">'+(s.gender==='female'?'👧':'👦')+'</div><div><div class="eyebrow">Profil Santri</div><h1 class="title">'+esc(s.name)+'</h1><p>'+esc(institution().name)+' · '+esc(klass().name)+' · '+(s.gender==='female'?'Perempuan':'Laki-laki')+'</p>'+(s.birth?'<p>🎂 '+esc(s.birth)+'</p>':'')+'</div></div></div><div class="panel"><div class="toolbar"><h2>Catatan & Observasi</h2><button class="btn" onclick="editNotes()">✎ Edit catatan</button></div><p style="white-space:pre-wrap;color:#c5d1e2">'+esc(s.notes||'Belum ada catatan. Tambahkan observasi untuk mendokumentasikan perkembangan santri.')+'</p></div><div class="panel"><h3>Riwayat Observasi</h3><p class="subtitle">Tahap selanjutnya: log observasi per tanggal, indikator belajar, dan grafik perkembangan.</p></div><div class="toolbar" style="margin-top:22px"><button class="btn ghost danger" onclick="deleteStudent()">Hapus santri</button></div>';return}
}
render();
</script></body></html>
